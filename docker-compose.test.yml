services:
  mysql-test:
    image: mysql:8.0
    container_name: taskmanager-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: testpassword
      MYSQL_DATABASE: taskmanager_test
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpassword
    ports:
      - "3307:3306"
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    container_name: taskmanager-backend-test
    environment:
      NODE_ENV: test
      PORT: 3001
      API_PREFIX: /api
      DB_HOST: mysql-test
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: testpassword
      DB_DATABASE: taskmanager_test
      JWT_SECRET: test-secret
      JWT_EXPIRES_IN: 24h
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      mysql-test:
        condition: service_healthy
    networks:
      - test-network

  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile.test
    container_name: taskmanager-frontend-test
    environment:
      NODE_ENV: test
    networks:
      - test-network

  mobile-app-test:
    build:
      context: ./mobile-app
      dockerfile: Dockerfile.test
    container_name: taskmanager-mobile-test
    environment:
      NODE_ENV: test
    networks:
      - test-network

networks:
  test-network:
    driver: bridge

