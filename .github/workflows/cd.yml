name: CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/taskmanager-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/taskmanager-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=http://${{ secrets.VPS_IP }}:3001/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push mobile app image
        uses: docker/build-push-action@v5
        with:
          context: ./mobile-app
          file: ./mobile-app/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/taskmanager-mobile:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/${{ secrets.VPS_USERNAME }}/bluemedical/"
          strip_components: 0

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VPS_USERNAME }}/bluemedical
            
            echo "Pulling latest images..."
            docker compose -f docker-compose.prod.yml pull
            
            echo "Stopping old containers..."
            docker compose -f docker-compose.prod.yml down
            
            echo "Starting new containers..."
            docker compose -f docker-compose.prod.yml up -d
            
            echo "Waiting for services to be ready..."
            sleep 10
            
            echo "Checking container status..."
            docker compose -f docker-compose.prod.yml ps
            
            echo "Cleaning up old images..."
            docker image prune -f
            
            echo "Deployment completed successfully!"

      - name: Health check
        run: |
          echo "Waiting 30 seconds for services to start..."
          sleep 30
          echo "Checking backend health..."
          curl -f http://${{ secrets.VPS_IP }}:3001/api/health || echo "Backend health check failed"